name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout family root
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # This is needed to be able to run ./gradlew below
      # You can run `git update-index --chmod +x gradlew` then remove this step.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew tools/fetch-members.sh

      # 每个家族成员是独立的 git 仓库，源码不在本仓库里。
      # 按 members.lock 把它们拉到对应目录，Gradle 才能看到完整的成员清单。
      - name: Fetch family members
        run: ./tools/fetch-members.sh

      - name: Build with Gradle
        run: ./gradlew build

      # 算法自检：这是这个家族真正的质量闸门。
      # 只跑 build 是不够的 —— build 只证明能编译，不证明算法还对。
      - name: Self test
        run: ./gradlew :base:selfTest

      # 持久化自检：证明一个仪式在服务器重启之后还在。
      - name: Persistence test
        run: ./gradlew :base:persistenceTest

      # 探针的自检：证明一个兄弟模组只用 Genesis 的契约就能站住。
      - name: Sandbox self test
        run: ./gradlew :sandbox:selfTest

      # 奥术的自检：证明仪式的规则不依赖游戏。
      - name: Arcana self test
        run: ./gradlew :arcana:selfTest

      # 离线验证：真实 Minecraft + 桩件，跑完全部自检（含材质自检）。
      # 材质自检要遍历游戏的注册表，而注册表在游戏启动之前是不可用的 ——
      # 真实 NeoForge 在类路径上时，连 SharedConstants 的静态初始化都要向模组加载器要东西，
      # 所以独立进程走不到注册表。这一步换用真实 Minecraft 加桩件，绕过这个限制。
      - name: Offline verification
        shell: pwsh
        run: |
          pwsh -File verification/fetch26.ps1
          pwsh -File verification/prep.ps1
          pwsh -File verification/build-and-test.ps1
