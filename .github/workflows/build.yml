name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout family root
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # This is needed to be able to run ./gradlew below
      # You can run `git update-index --chmod +x gradlew` then remove this step.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew tools/fetch-members.sh

      # 每个家族成员是独立的 git 仓库，源码不在本仓库里。
      # 按 members.lock 把它们拉到对应目录，Gradle 才能看到完整的成员清单。
      - name: Fetch family members
        run: ./tools/fetch-members.sh

      - name: Build with Gradle
        run: ./gradlew build

      # 算法自检：这是这个家族真正的质量闸门。
      # 只跑 build 是不够的 —— build 只证明能编译，不证明算法还对。
      - name: Self test
        run: ./gradlew :base:selfTest
