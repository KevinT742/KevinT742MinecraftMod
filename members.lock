# ============================================================================
# 家族成员版本清单
# ============================================================================
# 每个家族成员是**独立的 git 仓库**，本文件记录装配层要拉取哪些成员、
# 从哪个仓库、拉哪个 ref。
#
# 格式：<成员目录> | <仓库地址> | <ref>
#   * 空行与以 # 开头的行会被忽略
#   * ref 可以是分支名、tag 名或 commit SHA
#   * 建议用 commit SHA 锁定，保证"一套能跑通的家族"是确定的
#
# 为什么需要这个文件：
#   成员之间会通过 implementation project(':base') 互相依赖，
#   而成员源码不在本仓库里。只锁本仓库的 commit 是不够的，
#   还需要锁住每个成员的 ref —— 两者合起来才是一套确定的家族。
#
# 新增成员时：
#   1. 在 settings.gradle 加 include '成员名'
#   2. 在 .gitignore 加 /成员名/
#   3. 在本文件加一行
# ============================================================================

base | https://github.com/KevinT742/Genesis.git | main
sandbox | https://github.com/KevinT742/Sandbox.git | main
